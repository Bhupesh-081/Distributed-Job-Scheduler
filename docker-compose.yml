services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      - postgres
    # No published port: only Caddy talks to this, over the compose network.

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80" # HTTP->HTTPS redirect + ACME challenge, handled by Caddy automatically
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
