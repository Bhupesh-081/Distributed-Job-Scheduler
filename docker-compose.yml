services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Single-node Kafka in KRaft mode (no Zookeeper - Zookeeper is deprecated
  # upstream as of Kafka 3.x/4.0, and one fewer container to run for a local
  # single-broker setup). Two listeners: PLAINTEXT_HOST for bare-metal
  # services (go run, outside compose) connecting via localhost:9092,
  # PLAINTEXT for services that later run inside the compose network,
  # connecting via kafka:19092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Single-broker dev cluster: the default replication factor of 3 for
      # internal topics can never satisfy on 1 broker, which permanently
      # breaks consumer group coordination (__consumer_offsets never
      # auto-creates).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REDIS_ADDR: redis:6379
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env - see .env.example for Gmail setup}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
    depends_on:
      - postgres
      - redis
    # No published port: only Caddy talks to this, over the compose network.

  job-service:
    build:
      context: .
      args:
        SERVICE: job-service
    environment:
      PORT: 8081
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
    # No published port: only Caddy talks to this, over the compose network.

  watcher-service:
    build:
      context: .
      args:
        SERVICE: watcher-service
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      # kafka:19092 is the PLAINTEXT listener for in-network services, not
      # the PLAINTEXT_HOST one bare-metal `go run` uses via localhost:9092.
      KAFKA_BROKERS: kafka:19092
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - kafka
      - redis

  consumer-service:
    build:
      context: .
      args:
        SERVICE: consumer-service
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    depends_on:
      - postgres
      - redis
      - kafka

  caddy:
    image: docker.io/caddy:2-alpine
    ports:
      - "443:443"
      - "80:80" # HTTP->HTTPS redirect + ACME challenge, handled by Caddy automatically
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - job-service

volumes:
  pgdata:
  caddy_data:
